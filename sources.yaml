# Cinco fuentes del enunciado. Para la entrega: dejad exactamente TRES
# activas (comentad o borrad las otras dos) y documentad la elección.
#
# url fija     → data/raw/{id}.{format}
# url_template → data/raw/{id}_{iso2}.{format}
#   marcadores: {iso2} {iso3}

focus_countries:
  - { iso2: ES, iso3: ESP }
  - { iso2: FR, iso3: FRA }
  - { iso2: DE, iso3: DEU }
  - { iso2: IT, iso3: ITA }
  - { iso2: PT, iso3: PRT }

sources:
  - id: countries_profile
    name: mledoze/countries (perfil e idiomas)
    url: https://raw.githubusercontent.com/mledoze/countries/master/countries.json
    format: json
    role: profile
    transformer: countries_profile

  - id: worldbank_gdp
    name: World Bank — PIB per cápita (NY.GDP.PCAP.CD)
    url_template: >-
      https://api.worldbank.org/v2/country/{iso2}/indicator/NY.GDP.PCAP.CD?format=json&mrnev=1
    format: json
    role: indicator
    transformer: worldbank_indicator
    meta:
      indicator_id: NY.GDP.PCAP.CD
      indicator_label: GDP per capita (current US$)
      unit: USD

  - id: eurostat_pop
    name: Eurostat — población (demo_pjan)
    url_template: >-
      https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_pjan?format=JSON&lang=en&geo={iso2}&sex=T&age=TOTAL&time=2023
    format: json
    role: indicator
    transformer: eurostat_demo_pjan
    meta:
      indicator_id: demo_pjan
      indicator_label: Population on 1 January
      unit: persons
      time: "2023"

